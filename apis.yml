specificationVersion: "0.19"
description: >
  HouseCanary is a property analytics platform providing REST APIs for automated valuation
  model (AVM) data, property details, rental estimates, market forecasts, and flood/risk
  data across more than 100 million US residential properties. The Analytics API supports
  property-level endpoints including value, rental value, land value, sales history, tax
  history, and LTV calculations accessed via HTTP Basic Authentication. The Order Manager
  API allows clients to programmatically order HouseCanary valuation and inspection products
  and receive results via webhook. HouseCanary also offers a Python SDK and a Postman
  collection for integration testing.
