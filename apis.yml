apis:
  - name: HouseCanary Analytics API
    description: >
      REST API providing property-level data including AVM valuations, rental value,
      land value, LTV, sales history, tax history, flood data, school info, and
      geographic features for US residential properties.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://www.housecanary.com/resources/developer-tools
    baseURL: https://api.housecanary.com
    tags:
      - Valuation
      - Property Data
      - AVM
      - Rental Estimates
    properties:
      - type: Documentation
        url: https://api-docs-legacy.housecanary.com/
      - type: OpenAPI
        url: https://api-docs-legacy.housecanary.com/
  - name: HouseCanary Order Manager API
    description: >
      REST API for clients and partners to programmatically create valuation and
      inspection orders, receive status updates via webhook, export results, and
      download reports. Includes a sandbox environment for testing.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://order-manager-api.housecanary.com/docs/index.html
